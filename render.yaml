# ===================================================================
# SmartCart - Render Blueprint (Infrastructure as Code)
# ===================================================================
# This file defines all services for one-click deployment on Render.
# Deploy via: https://render.com/deploy -> Connect your GitHub repo
# ===================================================================

services:
  # -----------------------------------------------------------------
  # Spring Boot Backend (Docker Web Service)
  # -----------------------------------------------------------------
  - type: web
    name: smartcart-backend
    runtime: docker
    dockerfilePath: ./smartcart-backend/Dockerfile
    dockerContext: ./smartcart-backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Automatically wire PostgreSQL connection URL from the managed database
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: smartcart-db
          property: connectionString
      # Automatically wire Redis host and port from the managed Redis service
      - key: REDIS_HOST
        fromService:
          type: redis
          name: smartcart-cache
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: smartcart-cache
          property: port
      # Automatically generate a secure 64-character JWT secret on first build
      - key: JWT_SECRET
        generateValue: true
      # Razorpay payment keys (to be provided in the Render UI during setup)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://smartcart-shop.onrender.com
      - key: PORT
        value: "8080"

  # -----------------------------------------------------------------
  # React Frontend (Static Site on Global CDN)
  # -----------------------------------------------------------------
  - type: web
    name: smartcart-shop
    runtime: static
    buildCommand: cd smartcart-frontend && npm ci && npm run build
    staticPublishPath: ./smartcart-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartcart-backend.onrender.com/api

  # -----------------------------------------------------------------
  # Redis Cache Instance
  # -----------------------------------------------------------------
  - type: redis
    name: smartcart-cache
    plan: free
    region: oregon
    ipAllowList: []

# -------------------------------------------------------------------
# Managed PostgreSQL Database Instance
# -------------------------------------------------------------------
databases:
  - name: smartcart-db
    plan: free
    region: oregon
