# Render Blueprint for deployment

services:
  # Spring Boot Backend (Docker Web Service)
  - type: web
    name: smartcart-backend
    runtime: docker
    dockerfilePath: ./smartcart-backend/Dockerfile
    dockerContext: ./smartcart-backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: smartcart-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: smartcart-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: smartcart-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: smartcart-cache
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: smartcart-cache
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://smartcart-shop.onrender.com,https://smartcart-shop-gm45.onrender.com
      - key: PORT
        value: "8080"

  # React Frontend
  - type: web
    name: smartcart-shop
    runtime: static
    buildCommand: cd smartcart-frontend && npm ci && npm run build
    staticPublishPath: ./smartcart-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartcart-backend-gm45.onrender.com/api

  # Redis Cache Instance
  - type: redis
    name: smartcart-cache
    plan: free
    region: oregon
    ipAllowList: []

# Managed PostgreSQL Database Instance
databases:
  - name: smartcart-db
    plan: free
    region: oregon
