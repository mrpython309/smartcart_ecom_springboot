# ===================================================================
# SmartCart - Render Blueprint (Infrastructure as Code)
# ===================================================================
# This file defines all services for one-click deployment on Render.
# Deploy via: https://render.com/deploy -> Connect your GitHub repo
# ===================================================================

services:
  # -----------------------------------------------------------------
  # Spring Boot Backend (Docker Web Service)
  # -----------------------------------------------------------------
  - type: web
    name: smartcart-backend
    runtime: docker
    dockerfilePath: ./smartcart-backend/Dockerfile
    dockerContext: ./smartcart-backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # SmartCart is currently configured for MySQL in production.
      # Provide a MySQL JDBC URL, for example:
      # jdbc:mysql://host:3306/smartcart_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://smartcart-shop.onrender.com
      - key: PORT
        value: "8080"

  # -----------------------------------------------------------------
  # React Frontend (Static Site on Global CDN)
  # -----------------------------------------------------------------
  - type: web
    name: smartcart-shop
    runtime: static
    buildCommand: cd smartcart-frontend && npm ci && npm run build
    staticPublishPath: ./smartcart-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartcart-backend.onrender.com/api
