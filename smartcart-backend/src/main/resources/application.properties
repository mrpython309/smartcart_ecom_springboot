# ===================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartcart_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:8080}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Connection Pool (Hikari)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===================================================================
# FILE STORAGE CONFIGURATION
# ===================================================================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================================================================
# SECURITY & JWT CONFIGURATION
# ===================================================================
# Token validity: 24 hours (86400000 ms)
app.jwt.secret=${JWT_SECRET:NGE2NzQ3M2QwNTk4YTJmZDJmZDAzNTEzM2QxYzRlOTc2OGEzNWVlMzEzYzBmNDQzODMxODdhNTUzODM1YmU1MQ==}
app.jwt.expiration=86400000

# CORS Allowed Origins
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}


# ===================================================================
# LOGGING & OBSERVABILITY
# ===================================================================
logging.level.root=INFO
logging.level.com.smartcart=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Monitoring & Health (Actuator)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Info
info.app.name=SmartCart Backend
info.app.version=1.0.0
info.app.description=Premium Full-Stack E-Commerce Platform

# ===================================================================
# RAZORPAY PAYMENT GATEWAY
# ===================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_yourkeyhere}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:yoursecrethere}
