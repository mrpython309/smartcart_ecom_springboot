# ===================================================================
# SmartCart — Development Profile
# ===================================================================

spring:
  # --- Database (MySQL) ---
  datasource:
    url: jdbc:mysql://localhost:3307/smartcart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: admin
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # --- Redis (local) ---
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# --- Logging ---
logging:
  level:
    root: INFO
    com.smartcart: DEBUG
    org.springframework.security: WARN
    org.springframework.cache: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
